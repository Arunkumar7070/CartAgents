services:
  - type: web
    name: cartagent-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: DAILY_LLM_CALL_CAP
        value: "300"
      - key: SESSION_LLM_CALL_CAP
        value: "60"
      - key: DB_POOL_SIZE
        value: "3"
