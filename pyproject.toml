[project]
name = "ecommerce-ai-agent"
version = "0.2.0"
description = "E-commerce AI Agent - FastAPI + LangGraph + Google Gemini"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "langgraph>=1.0.10",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-checkpoint-postgres>=3.1.1",
    "psycopg[binary,pool]>=3.2.0",
    "langchain-google-genai>=4.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28.0",
    "anyio>=4.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/llm/prompts.py" = ["E501"]   # LLM prompts - breaking lines alters prompt text

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:langchain_core.*",
]

[tool.ruff.format]
quote-style = "double"
