services:
  db:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      POSTGRES_USER: cartagent
      POSTGRES_PASSWORD: cartagent
      POSTGRES_DB: cartagent
    ports:
      # Host 5433 avoids clashing with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartagent -d cartagent"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: python -m app.db.migrate
    environment:
      DATABASE_URL: postgresql://cartagent:cartagent@db:5432/cartagent
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cartagent:cartagent@db:5432/cartagent
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app
      - ./embedding:/app/embedding
      - ./evaluation:/app/evaluation
      - ./data:/app/data

volumes:
  pg-data:
